spring.application.name=orderdesk
spring.datasource.url=jdbc:h2:file:./data/orderdesk;LOCK_TIMEOUT=10000
spring.jpa.hibernate.ddl-auto=validate
# Project convention: entities never leave the service layer, so open-in-view stays off.
spring.jpa.open-in-view=false
orderdesk.business-zone=Asia/Shanghai
orderdesk.max-order-amount=10000.00
